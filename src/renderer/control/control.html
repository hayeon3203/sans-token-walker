<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="control.css" />
</head>
<body>
  <h1>Claude 토큰 모니터</h1>

  <section>
    <label for="maxTokens">목표 최대 토큰 수 (Max)</label>
    <div class="row">
      <input id="maxTokens" type="number" min="1" step="1000" />
      <button id="saveMax">저장</button>
    </div>
  </section>

  <section class="state">
    <p>누적: <span id="accumulated">0</span> / <span id="max">0</span></p>
    <p>사용률: <span id="percent">0</span>%</p>
    <button id="reset">사용률 초기화 (0%로)</button>
  </section>

  <section>
    <p class="label">테스트 트리거</p>
    <div class="row">
      <button data-percent="30">30%</button>
      <button data-percent="50">50%</button>
      <button data-percent="90">90%</button>
      <button data-percent="95">95%</button>
      <button data-percent="99">99%</button>
    </div>
  </section>

  <script src="control.js"></script>
</body>
</html>
